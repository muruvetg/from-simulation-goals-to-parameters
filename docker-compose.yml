version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: simulation-db
    restart: always
    environment:
      POSTGRES_DB: simulation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: simulation-app
    restart: always
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/simulation_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

volumes:
  postgres_data: